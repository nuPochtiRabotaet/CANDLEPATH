name: CandlePath v0.9 verification

'on':
  push:
    branches:
      - develop/v0.9
      - audit/v09-ten-pass-hardening
      - feat/v09-offline-forecast-evaluation
      - fix/v09-replay-regression-round2
  pull_request:
    paths:
      - 'moex_intelligence/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/candlepath-v09.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'candlepath-v09-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MOEX_DATA_DIR: /tmp/candlepath-v09-test-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.in
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact project dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.in -r requirements-dev.in
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Python source compilation
        run: python -m compileall -q moex_intelligence tests scripts
      - name: JavaScript syntax
        run: node --check moex_intelligence/components/trade.js
      - name: Deterministic forecast geometry and quantile contract
        run: node scripts/verify_v09_forecast_geometry.js
      - name: Deterministic chart update and signal indexing contract
        run: node scripts/verify_v09_chart_updates.js
      - name: Full Python tests (not selectively skipped)
        run: python -m pytest -q --disable-warnings --junitxml=pytest-candlepath-v09.xml
      - name: Browser integration smoke on synthetic candles
        run: python scripts/verify_v09_forecast_browser.py
      - name: Strategy Coliseum Streamlit browser smoke
        run: python scripts/verify_coliseum_browser.py
      - name: Public Bybit SPOT historical probe (diagnostic; no secrets or trades)
        id: bybit_public
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python scripts/evaluate_bybit_public_v09.py --symbol BTCUSDT --timeframe 15 --bars 1600 --output bybit-public-v09.json
      - name: Explicitly report external-market verification status
        if: always()
        env:
          BYBIT_PROBE_OUTCOME: ${{ steps.bybit_public.outcome }}
        run: |
          echo "Bybit public REST historical probe: $BYBIT_PROBE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYBIT_PROBE_OUTCOME" != "success" ]; then
            echo "Real Bybit historical evaluation remains UNVERIFIED (network/region/API failure)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Real Bybit historical evaluation remains unverified. Never substitute synthetic history."
          fi
      - name: Upload public-market diagnostic if verified
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candlepath-v09-public-market-report
          path: bybit-public-v09.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candlepath-v09-test-results
          path: pytest-candlepath-v09.xml
          if-no-files-found: ignore
          retention-days: 7
